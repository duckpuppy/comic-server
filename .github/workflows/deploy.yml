name: Deploy

on:
  workflow_run:
    workflows: ['Build and Publish Docker Images']
    types: [completed]

jobs:
  deploy:
    name: Deploy to mediaserver (live testing)
    runs-on: [self-hosted, comic-server]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Deploy latest image
        working-directory: /home/duckpuppy/src/services
        run: just comic-server-deploy
