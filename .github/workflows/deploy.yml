name: Deploy

on:
  workflow_run:
    workflows: ['Build and Publish Docker Images']
    types: [completed]

# Queue overlapping deploys rather than canceling one mid-restart -
# `docker compose pull && up -d` is quick but not instant, and letting a
# deploy run to completion before the next one starts avoids stacking two
# `docker compose up -d` calls against the same container. No
# cancel-in-progress: unlike the build workflow, an in-flight deploy isn't
# safely interruptible.
concurrency:
  group: deploy-mediaserver

jobs:
  deploy:
    name: Deploy to mediaserver (live testing)
    runs-on: [self-hosted, comic-server]
    # head_branch is "main" for a plain branch push, but is the tag name
    # itself (e.g. "v1.9.0") for a tag push - a tagged release build's
    # workflow_run was silently skipped here before this fix, even though
    # tagging is the actual trigger for a real release deploy (mediaserver
    # only pulls the "latest" image tag, which docker-publish.yml only
    # republishes on a vX.Y.Z tag push, not on a plain main push).
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) }}
    steps:
      - name: Deploy latest image
        working-directory: /home/duckpuppy/src/services
        run: just comic-server-deploy
